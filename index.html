<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深夜咖啡</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      color: #3d3229;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("assets/bg.png") center / cover no-repeat;
      filter: brightness(1.18) saturate(1.08);
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          160deg,
          rgba(15, 15, 26, 0.18) 0%,
          rgba(26, 26, 46, 0.08) 100%
        ),
        radial-gradient(
          ellipse at center,
          transparent 45%,
          rgba(15, 15, 26, 0.12) 100%
        );
      pointer-events: none;
      z-index: 0;
    }

    /* 背景粒子 — 热气 / 光尘 */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 240, 210, 0.55) 0%,
        rgba(255, 230, 190, 0.15) 45%,
        transparent 70%
      );
      filter: blur(1.5px);
      opacity: 0;
      animation: particleFloat linear infinite;
    }

    .particle--steam {
      border-radius: 40% 60% 50% 50%;
      background: radial-gradient(
        ellipse,
        rgba(255, 248, 235, 0.35) 0%,
        rgba(255, 235, 200, 0.08) 50%,
        transparent 75%
      );
      filter: blur(3px);
    }

    @keyframes particleFloat {
      0% {
        transform: translate(0, 0) scale(0.6);
        opacity: 0;
      }
      8% {
        opacity: var(--peak, 0.18);
      }
      75% {
        opacity: calc(var(--peak, 0.18) * 0.5);
      }
      100% {
        transform: translate(var(--drift, 20px), -110vh) scale(1.1);
        opacity: 0;
      }
    }

    .particle:nth-child(1)  { left: 8%;  bottom: -5%;  width: 4px;  height: 4px;  --drift: 12px;  --peak: 0.12; animation-duration: 18s; animation-delay: 0s; }
    .particle:nth-child(2)  { left: 18%; bottom: -8%;  width: 6px;  height: 6px;  --drift: -18px; --peak: 0.15; animation-duration: 22s; animation-delay: -4s; }
    .particle:nth-child(3)  { left: 28%; bottom: -3%;  width: 3px;  height: 3px;  --drift: 8px;   --peak: 0.1;  animation-duration: 16s; animation-delay: -9s; }
    .particle:nth-child(4)  { left: 42%; bottom: -6%;  width: 5px;  height: 5px;  --drift: -10px; --peak: 0.14; animation-duration: 20s; animation-delay: -2s; }
    .particle:nth-child(5)  { left: 55%; bottom: -4%;  width: 3px;  height: 3px;  --drift: 22px;  --peak: 0.11; animation-duration: 24s; animation-delay: -11s; }
    .particle:nth-child(6)  { left: 68%; bottom: -7%;  width: 4px;  height: 4px;  --drift: -14px; --peak: 0.13; animation-duration: 19s; animation-delay: -6s; }
    .particle:nth-child(7)  { left: 78%; bottom: -5%;  width: 5px;  height: 5px;  --drift: 16px;  --peak: 0.12; animation-duration: 21s; animation-delay: -14s; }
    .particle:nth-child(8)  { left: 88%; bottom: -8%;  width: 3px;  height: 3px;  --drift: -8px;  --peak: 0.1;  animation-duration: 17s; animation-delay: -7s; }
    .particle:nth-child(9)  { left: 35%; bottom: -10%; width: 14px; height: 10px; --drift: 6px;   --peak: 0.08; animation-duration: 26s; animation-delay: -3s; }
    .particle:nth-child(10) { left: 62%; bottom: -12%; width: 12px; height: 9px;  --drift: -12px; --peak: 0.07; animation-duration: 28s; animation-delay: -16s; }
    .particle:nth-child(11) { left: 12%; bottom: -6%;  width: 2px;  height: 2px;  --drift: 25px;  --peak: 0.09; animation-duration: 15s; animation-delay: -5s; }
    .particle:nth-child(12) { left: 48%; bottom: -9%;  width: 2px;  height: 2px;  --drift: -20px; --peak: 0.08; animation-duration: 23s; animation-delay: -12s; }
    .particle:nth-child(9),
    .particle:nth-child(10) {
      animation-name: particleSteam;
    }

    @keyframes particleSteam {
      0% {
        transform: translate(0, 0) scale(0.5) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: var(--peak, 0.08);
      }
      80% {
        opacity: calc(var(--peak, 0.08) * 0.4);
      }
      100% {
        transform: translate(var(--drift, 10px), -110vh) scale(1.3) rotate(15deg);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .particle {
        animation: none;
        opacity: 0;
      }
    }

    .game-container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* 时间显示 — 卡片内右上角 */
    .clock {
      position: absolute;
      top: 20px;
      right: 40px;
      font-size: 13px;
      font-weight: 600;
      color: #6b5344;
      letter-spacing: 1px;
      z-index: 10;
      user-select: none;
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }

    /* 静音按钮 — 卡片内左上角 */
    .mute-btn {
      position: absolute;
      top: 16px;
      left: 36px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid rgba(198, 123, 92, 0.45);
      background: rgba(255, 248, 240, 0.45);
      color: #8b7355;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .mute-btn:hover {
      background: rgba(198, 123, 92, 0.12);
      border-color: #c67b5c;
      color: #6b5344;
      transform: scale(1.06);
    }

    .mute-btn:active {
      transform: scale(0.96);
    }

    .mute-btn.is-muted {
      opacity: 0.72;
      border-color: rgba(198, 123, 92, 0.3);
    }

    .mute-btn.is-muted .mute-icon::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 1.5px;
      background: #8b7355;
      transform: rotate(-45deg);
      border-radius: 1px;
    }

    .mute-icon {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-style: normal;
    }

    /* 中央卡片 */
    .card {
      position: relative;
      overflow: hidden;
      width: 100%;
      background: rgba(255, 248, 240, 0.52);
      backdrop-filter: blur(28px) saturate(1.1);
      -webkit-backdrop-filter: blur(28px) saturate(1.1);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.22),
        0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      padding: 48px 40px;
      margin: 0 auto;
    }

    /* 页面加载入场 */
    .card.card-enter {
      opacity: 0;
      transform: scale(0.95);
      animation: cardEnter 0.8s ease-out forwards;
    }

    @keyframes cardEnter {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .card.card-breathing {
      animation: cardBreathe 3s ease-in-out infinite;
    }

    @keyframes cardBreathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* 封面页 */
    .cover-screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 40px;
      border-radius: inherit;
      background: transparent;
      transition: opacity 0.5s ease-out;
    }

    .cover-screen.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .cover-divider {
      width: 60px;
      height: 1px;
      background: #c67b5c;
      margin: 0 auto 28px;
    }

    .cover-title {
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #1a1008;
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-shadow: 0 1px 3px rgba(255, 248, 240, 0.8);
    }

    .cover-subtitle {
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-size: 17px;
      font-weight: 500;
      color: #6b5344;
      letter-spacing: 1px;
      line-height: 1.9;
      margin-bottom: 44px;
      max-width: 320px;
    }

    .cover-start-btn {
      background: rgba(38, 30, 26, 0.88);
      color: #fff8f0;
      border: 1.5px solid rgba(198, 123, 92, 0.45);
      border-radius: 12px;
      padding: 16px 48px;
      font-size: 17px;
      font-weight: 600;
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 200px;
    }

    .cover-start-btn:hover {
      background: rgba(58, 44, 36, 0.94);
      border-color: #c67b5c;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.22);
    }

    .cover-start-btn:active {
      transform: translateY(0) scale(0.98);
      opacity: 0.92;
    }

    .cover-meta {
      position: absolute;
      top: 20px;
      right: 40px;
      font-size: 13px;
      font-weight: 600;
      color: #6b5344;
      letter-spacing: 1px;
      user-select: none;
    }

    .card:not(.game-started) .mute-btn,
    .card:not(.game-started) .clock,
    .card:not(.game-started) .scene-content {
      visibility: hidden;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .card.card-breathing {
        animation: none;
      }
    }

    /* 幕间切换 */
    .scene-content {
      transition: none;
    }

    .scene-content.scene-exit {
      opacity: 0;
      transition: opacity 0.4s ease-out;
    }

    .scene-content.scene-enter {
      opacity: 0;
      transform: translateY(20px);
    }

    .scene-content.scene-enter-active {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    /* 标题 */
    .title {
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #1a1008;
      letter-spacing: 1px;
      margin-bottom: 32px;
      text-align: center;
      text-shadow: 0 1px 3px rgba(255, 248, 240, 0.8);
    }

    /* 正文叙事 */
    .story-text {
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #221a12;
      line-height: 1.95;
      letter-spacing: 0.6px;
      text-align: justify;
      white-space: pre-wrap;
      min-height: 200px;
      overflow-y: auto;
      cursor: pointer;
      text-shadow:
        0 0 1px rgba(255, 252, 245, 0.95),
        0 1px 4px rgba(255, 248, 240, 0.85);
    }

    /* 自定义滚动条 */
    .story-text::-webkit-scrollbar {
      width: 4px;
    }

    .story-text::-webkit-scrollbar-track {
      background: transparent;
    }

    .story-text::-webkit-scrollbar-thumb {
      background: rgba(198, 123, 92, 0.3);
      border-radius: 4px;
    }

    .story-text::-webkit-scrollbar-thumb:hover {
      background: rgba(198, 123, 92, 0.5);
    }

    /* 打字机光标 */
    .story-text.typing::after {
      content: "|";
      color: #c67b5c;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* 结局插画 */
    .ending-art-wrap {
      display: none;
      margin-bottom: 24px;
    }

    .card.ending-mode .ending-art-wrap.is-active {
      display: block;
    }

    .ending-art {
      display: block;
      width: 100%;
      border-radius: 16px;
      object-fit: cover;
      max-height: 280px;
      min-height: 160px;
      aspect-ratio: 16 / 9;
      background: #e8dcc4;
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
    }

    @media (prefers-reduced-motion: reduce) {
      .ending-art {
        transition: none;
      }
    }

    .ending-art.is-visible {
      opacity: 1;
      transform: scale(1);
    }

    /* 结局分隔线 */
    .ending-divider {
      display: none;
      width: 60px;
      height: 1px;
      background: #c67b5c;
      margin: 24px auto;
    }

    .card.ending-mode .ending-divider {
      display: block;
    }

    /* 结局文字 */
    .card.ending-mode .story-text {
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #1a1008;
      line-height: 2.0;
      text-align: center;
      min-height: auto;
      text-shadow: 0 1px 4px rgba(255, 248, 240, 0.9);
    }

    .card.ending-mode .title {
      display: none;
    }

    /* 选择按钮容器 */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 40px;
    }

    .choice-btn {
      background: rgba(38, 30, 26, 0.88);
      border: 1.5px solid rgba(198, 123, 92, 0.45);
      color: #fff8f0;
      border-radius: 12px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 600;
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      line-height: 1.65;
      opacity: 0;
      transform: translateY(10px);
    }

    .choices.visible .choice-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .choice-btn:hover {
      background: rgba(58, 44, 36, 0.94);
      border-color: #c67b5c;
      color: #fffaf5;
      transform: translateX(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.28);
    }

    .choice-btn:active {
      transform: translateX(4px) scale(0.98);
      opacity: 0.9;
    }

    .choices.visible .choice-btn:hover {
      transform: translateX(8px);
    }

    .choices.visible .choice-btn:active {
      transform: translateX(4px) scale(0.98);
    }

    /* 再喝一杯按钮 */
    .restart-btn {
      background: #c67b5c;
      color: #fff8f0;
      border: none;
      border-radius: 50px;
      padding: 14px 48px;
      font-size: 16px;
      font-weight: 600;
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      margin-top: 40px;
      text-align: center;
      align-self: center;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }

    .choices.visible .restart-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .restart-btn:hover {
      background: #f4a261;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(244, 162, 97, 0.3);
    }

    .restart-btn:active {
      transform: translateY(0) scale(0.98);
      opacity: 0.9;
    }

    .choices.restart-only {
      align-items: center;
    }

    /* 响应式 */
    @media (max-width: 640px) {
      body {
        padding: 16px;
        align-items: flex-start;
        padding-top: 32px;
      }

      .game-container {
        padding-top: 28px;
      }

      .clock {
        top: -28px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        text-align: center;
      }

      .mute-btn {
        top: 14px;
        left: 20px;
        width: 32px;
        height: 32px;
        font-size: 14px;
      }

      .card {
        padding: 32px 24px;
        border-radius: 20px;
        overflow: visible;
      }

      .title {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 24px;
      }

      .story-text {
        font-size: 18px;
        font-weight: 600;
        min-height: 160px;
      }

      .card.ending-mode .story-text {
        font-size: 22px;
        font-weight: 700;
      }

      .ending-art {
        max-height: 220px;
        border-radius: 14px;
      }

      .choice-btn {
        padding: 14px 20px;
      }

      .cover-screen {
        padding: 32px 24px;
      }

      .cover-meta {
        top: 14px;
        right: 24px;
      }

      .cover-title {
        font-size: 30px;
        letter-spacing: 1px;
      }

      .cover-subtitle {
        font-size: 16px;
        margin-bottom: 36px;
      }

      .cover-start-btn {
        padding: 14px 40px;
        font-size: 16px;
        min-width: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="particles" aria-hidden="true">
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle particle--steam"></span>
    <span class="particle particle--steam"></span>
    <span class="particle"></span>
    <span class="particle"></span>
  </div>
  <audio id="bgm" loop preload="auto" src="assets/bgm.mp3"></audio>
  <div class="game-container" id="gameContainer">
    <div class="card card-enter" id="card">
      <div class="cover-screen" id="coverScreen">
        <span class="cover-meta">🕐 21:00</span>
        <div class="cover-divider"></div>
        <h1 class="cover-title">打烊后</h1>
        <p class="cover-subtitle">一个关于咖啡与雨夜的故事</p>
        <button class="cover-start-btn" id="startBtn" type="button">开始 ▶</button>
      </div>
      <button class="mute-btn" id="muteBtn" type="button" aria-label="静音" aria-pressed="false" title="静音">
        <span class="mute-icon" aria-hidden="true">♪</span>
      </button>
      <div class="clock" id="clock">🕐 21:00</div>
      <div class="scene-content" id="sceneContent">
        <h1 class="title" id="title">铃响</h1>
        <div class="ending-art-wrap" id="endingArtWrap">
          <img class="ending-art" id="endingArt" alt="" />
        </div>
        <div class="ending-divider" id="endingDivider"></div>
        <p class="story-text" id="story"></p>
        <div class="choices" id="choices"></div>
      </div>
    </div>
  </div>

  <script>
    const TYPE_SPEED = 25;
    const TIME_STEP = 15;

    let warmth = 0;
    let story = 0;
    let act = 0;
    let gameTime = { hour: 21, minute: 0 };
    let history = [];
    let typeInterval = null;
    let isTyping = false;
    let fullText = "";

    const clockEl = document.getElementById("clock");
    const cardEl = document.getElementById("card");
    const sceneContentEl = document.getElementById("sceneContent");
    const titleEl = document.getElementById("title");
    const storyEl = document.getElementById("story");
    const choicesEl = document.getElementById("choices");
    const gameContainerEl = document.getElementById("gameContainer");
    const endingArtWrapEl = document.getElementById("endingArtWrap");
    const endingArtEl = document.getElementById("endingArt");
    const bgmEl = document.getElementById("bgm");
    const muteBtn = document.getElementById("muteBtn");
    const coverScreenEl = document.getElementById("coverScreen");
    const startBtn = document.getElementById("startBtn");

    const BGM_VOLUME = 0.22;
    const MUTE_KEY = "coffee-game-muted";
    let bgmStarted = false;
    let gameStarted = false;
    let isMuted = localStorage.getItem(MUTE_KEY) === "true";

    let audioCtx = null;

    function applyMuteState() {
      if (bgmEl) bgmEl.muted = isMuted;
      muteBtn.classList.toggle("is-muted", isMuted);
      muteBtn.setAttribute("aria-pressed", String(isMuted));
      muteBtn.setAttribute("aria-label", isMuted ? "取消静音" : "静音");
      muteBtn.title = isMuted ? "取消静音" : "静音";
    }

    function toggleMute() {
      isMuted = !isMuted;
      localStorage.setItem(MUTE_KEY, String(isMuted));
      applyMuteState();
    }

    function startBgm() {
      if (bgmStarted || !bgmEl) return;
      bgmEl.volume = BGM_VOLUME;
      bgmEl.muted = isMuted;
      const playPromise = bgmEl.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          bgmStarted = true;
        }).catch(() => {
          bgmStarted = false;
        });
      }
    }

    function initAudio() {
      startBgm();
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playDing() {
      if (isMuted) return;
      const ctx = initAudio();
      const now = ctx.currentTime;

      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(1600, now);
      filter.Q.setValueAtTime(0.4, now);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.028, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

      filter.connect(gain);
      gain.connect(ctx.destination);

      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(659.25, now);
      osc.frequency.exponentialRampToValueAtTime(698.46, now + 0.1);

      const harmonic = ctx.createOscillator();
      harmonic.type = "sine";
      harmonic.frequency.setValueAtTime(1318.5, now);

      const harmGain = ctx.createGain();
      harmGain.gain.setValueAtTime(0, now);
      harmGain.gain.linearRampToValueAtTime(0.06, now + 0.018);
      harmGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

      osc.connect(filter);
      harmonic.connect(harmGain);
      harmGain.connect(filter);

      osc.start(now);
      harmonic.start(now);
      osc.stop(now + 0.52);
      harmonic.stop(now + 0.32);
    }

    const acts = [
      {
        title: "铃响",
        text: "打烊铃响了。你抬头看了眼挂钟，21:00。\n店里还有一位客人，坐在最里面的窗边。面前是一杯拿铁，一口没动。\n窗外在下雨。雨点顺着玻璃往下滑，像谁在窗外写字。",
        choices: [
          { label: "走过去，轻声说：\"您好，我们打烊了。\"", effects: { story: 1 }, next: "act2a" },
          { label: "先去收拾吧台，等他喝完自己离开。", effects: {}, next: "act2b" }
        ]
      }
    ];

    const scenes = {
      act2a: {
        title: "搭话",
        text: "客人抬起头。是个三十岁左右的男人，领带松着，眼睛很红。\n\"能再做一杯吗？\"他说，\"今天的有点苦。\"\n你注意到他的公文包上挂着工牌，但名字被磨得看不清了。",
        choices: [
          { label: "\"好的，您想换什么？我们菜单上还有特调。\"", effects: { warmth: 1 }, next: "act3" },
          { label: "\"……是咖啡苦，还是今天苦？\"", effects: { story: 1 }, next: "act3" }
        ]
      },
      act2b: {
        title: "搭话",
        text: "你擦着杯子，听见他轻轻叹了一口气。\n然后他说：\"能再做一杯吗？今天的……有点喝不下去。\"\n声音很轻，像怕打扰到雨。",
        choices: [
          { label: "\"好的，您想换什么？我们菜单上还有特调。\"", effects: { warmth: 1 }, next: "act3" },
          { label: "\"……是咖啡苦，还是今天苦？\"", effects: { story: 1 }, next: "act3" }
        ]
      },
      act3: {
        title: "缺料",
        text: "你走到操作台前，打开配料柜。\n肉桂粉用完了，标签还贴在罐子上。牛奶只剩半盒，保质期到明天。\n你看着窗外的雨，想起柜子里还有别的东西。",
        choices: [
          { label: "披上外套，去隔壁便利店买新的肉桂粉。", effects: { warmth: 2 }, next: "act4" },
          { label: "用最后半盒牛奶，做一杯最简单的热牛奶给他。", effects: { warmth: 1 }, next: "act4" },
          { label: "把窗台上自己养的那盆薄荷剪了两片叶子，加进去。", effects: { story: 2 }, next: "act4" }
        ]
      },
      act4: {
        title: "便签",
        text: "他喝得很慢。喝完，把杯子轻轻推回来。\n在杯垫下压了一张便签，起身推门走进雨里。\n你打开便签。上面只有半行字，后面被水渍晕开了。",
        choices: [
          { label: "把便签对折，收进了围裙口袋。", effects: { warmth: 1 }, next: "ending" },
          { label: "抓起伞追出去，还给他。", effects: { story: 1 }, next: "ending" },
          { label: "用胶带把便签贴在收银台后面，当装饰。", effects: {}, next: "ending" }
        ]
      }
    };

    const endings = {
      a: {
        title: "明天见",
        image: "./assets/ending-a.png",
        text: "便签上的字慢慢清晰：\n\"谢谢你。这家店我来了17天，今天是第一次有人问我咖啡苦不苦。\n明天见。\"\n雨停了。你看着窗外，路灯下有个影子在挥手。"
      },
      b: {
        title: "不必追",
        image: "./assets/ending-b.png",
        text: "便签上的字被水渍晕开，但你还是认出来了：\n\"其实我今天辞职了。这杯是告别。不必追，我已经好了。\n祝你今晚不加班。\"\n你站在门口，雨还在下。但他的伞已经走远了。"
      },
      c: {
        title: "今天不加班了",
        image: "./assets/ending-c.png",
        text: "便签上只有一行字：\n\"今天不加班了。替我把这杯喝完吧。\"\n你端起那杯冷掉的拿铁，喝了一口。确实很苦。"
      }
    };

    function formatTime() {
      const h = String(gameTime.hour).padStart(2, "0");
      const m = String(gameTime.minute).padStart(2, "0");
      return `${h}:${m}`;
    }

    function updateClock() {
      clockEl.textContent = `🕐 ${formatTime()}`;
    }

    function advanceTime() {
      gameTime.minute += TIME_STEP;
      if (gameTime.minute >= 60) {
        gameTime.hour += Math.floor(gameTime.minute / 60);
        gameTime.minute %= 60;
      }
      updateClock();
    }

    function applyEffects(effects) {
      if (effects.warmth) warmth += effects.warmth;
      if (effects.story) story += effects.story;
    }

    function clearTypewriter() {
      if (typeInterval) {
        clearInterval(typeInterval);
        typeInterval = null;
      }
      isTyping = false;
      storyEl.classList.remove("typing");
    }

    function showChoices(choices, isRestart) {
      choicesEl.innerHTML = "";
      choicesEl.classList.remove("restart-only");
      if (isRestart) choicesEl.classList.add("restart-only");

      choices.forEach((choice, i) => {
        const btn = document.createElement("button");
        btn.className = isRestart ? "choice-btn restart-btn" : "choice-btn";
        btn.textContent = choice.label;
        btn.style.transitionDelay = `${i * 0.1}s`;
        if (isRestart) {
          btn.addEventListener("click", () => location.reload());
        } else {
          btn.addEventListener("click", () => handleChoice(choice));
          btn.addEventListener("mouseenter", playDing);
        }
        choicesEl.appendChild(btn);
      });

      requestAnimationFrame(() => {
        choicesEl.classList.add("visible");
      });
    }

    function hideChoices() {
      choicesEl.classList.remove("visible", "restart-only");
      choicesEl.innerHTML = "";
    }

    function typewriter(text, onComplete) {
      clearTypewriter();
      fullText = text;
      storyEl.textContent = "";
      storyEl.classList.add("typing");
      isTyping = true;
      let index = 0;

      typeInterval = setInterval(() => {
        if (index < text.length) {
          storyEl.textContent += text[index];
          index++;
        } else {
          clearTypewriter();
          if (onComplete) onComplete();
        }
      }, TYPE_SPEED);
    }

    function skipTypewriter() {
      if (!isTyping) return;
      clearTypewriter();
      storyEl.textContent = fullText;
      showPendingChoices();
    }

    let pendingChoices = null;
    let pendingIsRestart = false;

    function showPendingChoices() {
      if (pendingChoices) {
        showChoices(pendingChoices, pendingIsRestart);
        pendingChoices = null;
        pendingIsRestart = false;
      }
    }

    function exitEndingMode() {
      cardEl.classList.remove("ending-mode");
      hideEndingArt();
    }

    function enterEndingMode() {
      cardEl.classList.add("ending-mode");
    }

    function hideEndingArt() {
      endingArtWrapEl.classList.remove("is-active");
      endingArtEl.classList.remove("is-visible");
      endingArtEl.removeAttribute("src");
      endingArtEl.alt = "";
    }

    function showEndingArt(ending, onReady) {
      const TEXT_DELAY = 300;
      const ANIM_DURATION = 800;

      endingArtWrapEl.classList.add("is-active");
      endingArtEl.classList.remove("is-visible");
      endingArtEl.alt = ending.title;

      function startTextDelay() {
        setTimeout(onReady, TEXT_DELAY);
      }

      function onImageReady() {
        requestAnimationFrame(() => {
          endingArtEl.classList.add("is-visible");
          const animDuration = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : ANIM_DURATION;
          setTimeout(onReady, animDuration + TEXT_DELAY);
        });
      }

      function onImageError() {
        endingArtWrapEl.classList.remove("is-active");
        endingArtEl.classList.remove("is-visible");
        startTextDelay();
      }

      endingArtEl.onload = () => {
        endingArtEl.onload = null;
        endingArtEl.onerror = null;
        onImageReady();
      };

      endingArtEl.onerror = () => {
        endingArtEl.onload = null;
        endingArtEl.onerror = null;
        onImageError();
      };

      endingArtEl.src = ending.image;

      if (endingArtEl.complete && endingArtEl.naturalWidth > 0) {
        endingArtEl.onload = null;
        endingArtEl.onerror = null;
        onImageReady();
      }
    }

    function playSceneEnter() {
      sceneContentEl.classList.remove("scene-exit");
      sceneContentEl.classList.add("scene-enter");
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          sceneContentEl.classList.add("scene-enter-active");
          sceneContentEl.addEventListener("transitionend", function onEnd(e) {
            if (e.propertyName !== "opacity") return;
            sceneContentEl.classList.remove("scene-enter", "scene-enter-active");
            sceneContentEl.removeEventListener("transitionend", onEnd);
          });
        });
      });
    }

    function displayScene(scene, choices) {
      exitEndingMode();
      titleEl.textContent = scene.title;
      pendingChoices = choices || null;
      pendingIsRestart = false;
      hideChoices();
      typewriter(scene.text, () => {
        if (pendingChoices) showChoices(pendingChoices, false);
      });
    }

    function fadeTransition(callback) {
      sceneContentEl.classList.remove("scene-enter", "scene-enter-active");
      sceneContentEl.classList.add("scene-exit");
      setTimeout(() => {
        callback();
        playSceneEnter();
      }, 400);
    }

    function getEndingKey() {
      if (warmth >= 3) return "a";
      if (story >= 3) return "b";
      return "c";
    }

    function getEnding() {
      return endings[getEndingKey()];
    }

    function showEnding() {
      const ending = getEnding();
      enterEndingMode();
      titleEl.textContent = ending.title;
      hideChoices();
      storyEl.textContent = "";
      clearTypewriter();
      pendingChoices = [{ label: "再喝一杯" }];
      pendingIsRestart = true;

      showEndingArt(ending, () => {
        typewriter(ending.text, () => {
          showChoices(pendingChoices, true);
          pendingChoices = null;
          pendingIsRestart = false;
        });
      });
    }

    function handleChoice(choice) {
      applyEffects(choice.effects);
      history.push(choice);
      advanceTime();
      act++;

      fadeTransition(() => {
        clearTypewriter();

        if (choice.next === "ending") {
          showEnding();
          return;
        }

        const scene = scenes[choice.next];
        if (scene) {
          displayScene(scene, scene.choices);
        }
      });
    }

    function startGame() {
      updateClock();
      const firstAct = acts[0];
      displayScene(firstAct, firstAct.choices);
    }

    function beginGame() {
      if (gameStarted) return;
      gameStarted = true;

      initAudio();
      applyMuteState();

      coverScreenEl.classList.add("is-hidden");
      cardEl.classList.remove("card-breathing");
      cardEl.classList.add("game-started");

      setTimeout(() => {
        coverScreenEl.style.display = "none";
        startGame();
      }, 500);
    }

    cardEl.addEventListener("animationend", (e) => {
      if (e.animationName === "cardEnter") {
        cardEl.classList.remove("card-enter");
        cardEl.classList.add("card-breathing");
      }
    });

    startBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      beginGame();
    });

    gameContainerEl.addEventListener("click", (e) => {
      if (!gameStarted) return;
      if (e.target.closest(".mute-btn")) return;
      if (e.target.closest(".choice-btn")) return;
      skipTypewriter();
    });

    muteBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!gameStarted) return;
      toggleMute();
      if (!isMuted) startBgm();
    });

    applyMuteState();
  </script>
